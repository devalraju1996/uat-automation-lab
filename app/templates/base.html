<!doctype html>
<html><head><meta charset="utf-8"><title>Payments Portal</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px}
.env{background:#ffe08a;padding:4px 8px;border-radius:4px;font-size:12px}
.msg{background:#dff5e1;padding:8px}.err{background:#fde2e1;padding:8px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:6px}
input,select,button{padding:6px;margin:4px 0}
</style></head>
<body><h1>Payments Portal <span class="env" data-testid="env-badge">{{ env|upper }}</span></h1>
{% block content %}{% endblock %}</body></html>
