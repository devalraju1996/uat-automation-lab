apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payments-dev
resources:
  - ../../base
nameSuffix: -dev
configMapGenerator:
  - name: payments-portal-config
    behavior: merge
    literals:
      - APP_ENV=dev
replicas:
  - name: payments-portal
    count: 1
images:
  - name: payments-portal
    newTag: latest
