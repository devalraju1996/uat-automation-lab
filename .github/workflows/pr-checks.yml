# Runs on every pull request. Branch protection should require this to pass before merge.
name: PR checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.8.6
      - run: ruff check .

  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform/ecs fmt -check -recursive
      - run: terraform -chdir=terraform/ecs init -backend=false && terraform -chdir=terraform/ecs validate
      - name: Kustomize build all overlays
        run: for env in dev sit uat; do kubectl kustomize kube/overlays/$env > /dev/null && echo "$env OK"; done

  smoke-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Smoke + API tests (app started locally by conftest)
        run: pytest -m "smoke or api"
      - name: AI failure analysis
        if: failure()
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: python -m ai_analysis.analyze_failures
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pr-test-artifacts, path: artifacts/ }

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t payments-portal:pr-${{ github.event.number }} .
