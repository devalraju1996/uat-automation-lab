[pytest]
testpaths = tests
bdd_features_base_dir = tests/features
markers =
    smoke: quick critical-path checks run on every PR
    regression: full UAT regression run after merge
    api: API-level tests
addopts = -p no:warnings -ra --junitxml=artifacts/junit.xml --html=artifacts/report.html --self-contained-html --screenshot only-on-failure --tracing retain-on-failure --output artifacts/playwright
